spec_version: v1
kind: native
name: SalesAgentADK_RA
llm: groq/openai/gpt-oss-120b  # watsonx Orchestrate (watsonx) model provider followed by the model id: ibm/granite-3-8b-instruct
style: react     
description: >
    Responds to queries about HDB's annual report and other related information.
instructions: >
    Use the knowledge base to answer questions about HDB's annual report. 
    For questions that are mainly about numbers, financial figures, or comparisons
    between years (e.g. deficits, capital expenditure, number of flats, solar targets),
    delegate the calculation part to StatsAgentADK_RA and use its answer in your reply.
    If the information is not available, respond with "I don't know".


welcome_content:
  welcome_message: "Hello, I'm HDB Assitant! How can I assist you today?"
hidden: false
starter_prompts:
  prompts:
    - title: "Summarize"
      id: "0"
      subtitle: ""
      prompt: "Summarise the land reclamation projects ongoing and successfully completed in the past year"
    - title: "View Stats"
      id: "1"
      subtitle: ""
      prompt: "What is the total income and capital expenditure for 2019/2020?"
    - title: "Find facts"
      id: "2"
      subtitle: ""
      prompt: "who is the chairman of the HDB?"

knowledge_base:
  - dummy_report

collaborators:
  - StatsAgentADK_RA

tools: []